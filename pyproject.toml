[project]
name = "ChunkFlow"
version = "0.1.0"
description = "A chunking pipeline for Markdown/PDF documents with an ingestion module to  Qdrant vector database"
authors = [
    {name = "Hugo Bacard",email = "hugo.bacard@ijclab.in2p3.fr"},
]
dependencies = [
    "markdown-it-py>=4.2.0",
 "pymupdf>=2.0",
 "tiktoken>=0.14.0",
 "qdrant-client>=1.20.0",
 "fastembed>=0.8.0",
 "httpx>=0.28.1",
 "pysbd>=0.3.4",
 "fastmcp>=4.1.3",
 "python-dotenv>=1.2.4",
]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "rag",
    "chunking",
    "qdrant",
    "vector database",
    "mcp",
    "markdown",
    "pdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[project.scripts]
chunkflow = "chunkflow.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=chunkflow --cov-report=term-missing"

[tool.coverage.run]
source = ["chunkflow"]
branch = true

[tool.coverage.report]
show_missing = true
# Regression floor (ingester tests skip without Qdrant); raise as coverage grows.
fail_under = 60

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "mcp[cli]>=2.3.0",
    "pytest-cov>=6.0.0",
]
